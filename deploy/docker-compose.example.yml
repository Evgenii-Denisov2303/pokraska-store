services:
  pokraska-store:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: pokraska-store
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:4173:4173"

  caddy:
    image: caddy:2-alpine
    container_name: pokraska-store-caddy
    restart: unless-stopped
    depends_on:
      - pokraska-store
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
