<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перенаправление в каталог</title>
    <meta name="robots" content="noindex,follow">
    <link rel="canonical" href="https://pokraska.store/pages/services.html">
    <meta http-equiv="refresh" content="0; url=/pages/services.html">
    <script>
        (function () {
            var target = '/pages/services.html';
            var suffix = window.location.search + window.location.hash;

            if (window.location.pathname !== target) {
                window.location.replace(target + suffix);
            }
        }());
    </script>
</head>
<body>
    <p>Страница перенесена. <a href="/pages/services.html">Перейти в каталог</a>.</p>
</body>
</html>
